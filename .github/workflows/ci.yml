name: CI

on:
  pull_request:
  push:
    branches: [main, develop, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build check
        run: npm run build
      - name: Test
        run: npm test
